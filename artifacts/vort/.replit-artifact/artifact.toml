kind = "web"
previewPath = "/"
title = "Vort — AI No-Code Builder"
version = "1.0.0"
id = "artifacts/vort"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20625

[services.development]
run = "pnpm --filter @workspace/vort run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vort", "run", "build" ]
publicDir = "artifacts/vort/.next/standalone"
serve = "static"

[services.env]
PORT = "20625"
